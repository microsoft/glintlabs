name: Advanced survey analysis
on:
  pull_request:
    paths:
      - "skills/analyze-survey-advanced/**"
      - "schemas/advanced-*.json"
      - "scripts/*advanced*"
      - "requirements-advanced-runtime.txt"
      - "tests/test_advanced_analysis.py"
      - ".github/workflows/advanced-analysis.yml"
  push:
    branches: [main]
    paths:
      - "skills/analyze-survey-advanced/**"
      - "schemas/advanced-*.json"
      - "scripts/*advanced*"
      - "requirements-advanced-runtime.txt"
      - "tests/test_advanced_analysis.py"
      - ".github/workflows/advanced-analysis.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install isolated advanced dependencies
        run: |
          python -m venv .venv-advanced
          .venv-advanced/bin/python -m pip install -r requirements-advanced-runtime.txt pytest==9.0.2
          .venv-advanced/bin/python -m pip check
      - name: Test consent, modeling, holdouts, evidence and sharing
        run: .venv-advanced/bin/python -m pytest tests/test_advanced_analysis.py -q
