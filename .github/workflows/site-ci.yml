name: Site CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: site-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: website

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Verify migration inventory
        run: node scripts/verify-migration.mjs

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build production site
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build public GitHub Pages reader
        run: npm run pages:build
        env:
          GLINTLABS_PAGES_TELEMETRY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.GLINTLABS_PAGES_TELEMETRY == 'true' && 'true' || 'false' }}
          GLINTLABS_PAGES_CLARITY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.GLINTLABS_PAGES_CLARITY == 'true' && 'true' || 'false' }}

      - name: Verify automatic analytics and privacy protections before release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && (vars.GLINTLABS_PAGES_TELEMETRY == 'true' || vars.GLINTLABS_PAGES_CLARITY == 'true')
        run: npm run pages:test:telemetry
        env:
          GLINTLABS_PAGES_TELEMETRY: ${{ vars.GLINTLABS_PAGES_TELEMETRY == 'true' && 'true' || 'false' }}
          GLINTLABS_PAGES_CLARITY: ${{ vars.GLINTLABS_PAGES_CLARITY == 'true' && 'true' || 'false' }}

      - name: Upload public reader only
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: website/out

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy approved public reader
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
